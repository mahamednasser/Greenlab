<header class="topbar">
  <div class="greeting">
    <h2>{{ 'TOPBAR.GREETING' | translate:{ name: greetingName() } }}</h2>
    <p>{{ today }}</p>
  </div>
  <div class="right">
    <div class="lang-inline" role="group" [attr.aria-label]="'LANG.SWITCH' | translate">
      <button type="button" class="lang-chip" [class.on]="lang.current === 'en'" (click)="lang.setLanguage('en')">EN</button>
      <button type="button" class="lang-chip" [class.on]="lang.current === 'ar'" (click)="lang.setLanguage('ar')">ع</button>
    </div>
    <button type="button" class="notif" aria-label="Notifications">
      <svg width="19" height="19" viewBox="0 0 19 19" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M9.5 2a5.5 5.5 0 00-5.5 5.5V11L2.5 13h14L15 11V7.5A5.5 5.5 0 009.5 2z"/>
        <path d="M7.5 13v.5a2 2 0 004 0V13"/>
      </svg>
      <span class="notif-dot"></span>
    </button>
    <button type="button" class="logout-btn" (click)="logout()">{{ 'TOPBAR.SIGN_OUT' | translate }}</button>
    <div class="avatar">{{ initials() }}</div>
  </div>
</header>
